name: atlas-auth-acceptance
services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: disposable-auth-only
      POSTGRES_DB: auth_acceptance
    ports: ['127.0.0.1:54329:5432']
    volumes: ['./init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      database:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://auth_test:disposable-auth-only@database:5432/auth_acceptance
      GOTRUE_SITE_URL: http://127.0.0.1:3002
      GOTRUE_JWT_SECRET: atlas-disposable-auth-test-secret-at-least-32-chars
      GOTRUE_JWT_EXP: 120
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_DISABLE_SIGNUP: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9999/health']
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    ports: ['127.0.0.1:54321:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:disposable-auth-only@database:5432/auth_acceptance
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: atlas-disposable-auth-test-secret-at-least-32-chars
