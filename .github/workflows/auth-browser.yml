name: console real auth browser acceptance
on:
  pull_request:
    paths: ['web/**', '.github/workflows/auth-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-browser:
    name: permitted denied expired (real GoTrue + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: node web/test/auth/environment.mjs
      - run: docker compose -f web/test/auth/compose.yml up -d --wait
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-evidence
          path: |
            web/playwright-report
            web/test-results
      - if: failure()
        run: docker compose -f web/test/auth/compose.yml logs
      - if: always()
        run: docker compose -f web/test/auth/compose.yml down -v
