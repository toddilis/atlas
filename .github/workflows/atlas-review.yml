name: Atlas reviewer

on:
  workflow_run:
    workflows: [atlas CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [review, initialize, pause, resume]
        default: review
        description: Review a verified candidate or control the persistent ledger
      pull_request:
        type: string
        description: PR number (review only)
      ci_run_id:
        type: string
        description: Successful atlas CI run ID (review only)

# All reservations and final receipts serialize across PRs and manual/automatic wakes.
# A cancelled pending workflow spends nothing; an interrupted active reservation is retained.
concurrency:
  group: atlas-independent-${{ (inputs.operation == 'pause' || inputs.operation == 'resume') && 'control' || 'review' }}
  cancel-in-progress: false
permissions: {}

jobs:
  prepare:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: atlas-review-publisher
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      dispatch: ${{ steps.prepare.outputs.dispatch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - id: prepare
        run: node scripts/reviewer/run.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_REVIEW_APP_PRIVATE_KEY: ${{ secrets.ATLAS_REVIEW_APP_PRIVATE_KEY }}
          REVIEW_OPERATION: ${{ inputs.operation || 'review' }}
      - if: steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-request
          path: review-artifacts/request.json
          if-no-files-found: error
          retention-days: 30

  review:
    needs: prepare
    if: needs.prepare.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Restrict this environment to the protected default branch before storing the key.
    environment: atlas-reviewer
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-request
          path: review-artifacts
      - run: node scripts/reviewer/run.mjs review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-response
          path: review-artifacts/response.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: atlas-review-publisher
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-request
          path: review-artifacts
      - if: needs.review.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-response
          path: review-artifacts
      - run: node scripts/reviewer/run.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_REVIEW_APP_PRIVATE_KEY: ${{ secrets.ATLAS_REVIEW_APP_PRIVATE_KEY }}
